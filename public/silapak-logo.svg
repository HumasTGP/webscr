<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Si Lapak Priok">
  <!-- Background -->
  <rect width="120" height="120" rx="18" fill="#0A3040"/>

  <!-- Box bottom -->
  <rect x="24" y="62" width="72" height="34" rx="5" fill="#FFC72C"/>

  <!-- Box top lid -->
  <rect x="20" y="48" width="80" height="18" rx="4" fill="#E6A700"/>

  <!-- Lid center tape -->
  <rect x="52" y="48" width="16" height="18" rx="2" fill="#FFC72C"/>

  <!-- Box front crease -->
  <line x1="60" y1="62" x2="60" y2="96" stroke="#E6A700" stroke-width="2" opacity="0.6"/>

  <!-- Handle / strap on lid -->
  <rect x="46" y="43" width="28" height="9" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>

  <!-- Text: Priok -->
  <text x="60" y="114" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="800"
        font-size="10" fill="#FFC72C" letter-spacing="2">Priok</text>
</svg>
