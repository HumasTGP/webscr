<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SIKAS">
  <!-- Background -->
  <rect width="120" height="120" rx="18" fill="#0A1628"/>

  <!-- Document body -->
  <rect x="28" y="22" width="54" height="66" rx="5" fill="none" stroke="#FFC72C" stroke-width="3.5"/>

  <!-- Folded corner -->
  <polyline points="66,22 82,22 82,40 66,40 66,22" fill="#FFC72C" stroke="#FFC72C" stroke-width="1"/>

  <!-- Document lines -->
  <line x1="38" y1="52" x2="72" y2="52" stroke="#FFC72C" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="38" y1="62" x2="72" y2="62" stroke="#FFC72C" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="38" y1="72" x2="58" y2="72" stroke="#FFC72C" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Lightning bolt overlay -->
