name: Repository Naming Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-repo-naming-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rename repository structure
        shell: bash
        run: |
          set -euo pipefail
          git mv src/sikas src/sakti
          git mv src/pengajuan-mitra src/gandeng
          git mv src/silapak-priok src/si-lapak-priok

          git mv src/gandeng/components/MitraSidebar.jsx src/gandeng/components/GandengSidebar.jsx
          git mv src/gandeng/pages/MitraAccountManagement.jsx src/gandeng/pages/GandengAccountManagement.jsx
          git mv src/gandeng/pages/MitraApp.jsx src/gandeng/pages/GandengApp.jsx
          git mv src/gandeng/pages/MitraBantuan.jsx src/gandeng/pages/GandengBantuan.jsx
          git mv src/gandeng/pages/MitraDashboard.jsx src/gandeng/pages/GandengDashboard.jsx
          git mv src/gandeng/pages/MitraLogin.jsx src/gandeng/pages/GandengLogin.jsx
          git mv src/gandeng/pages/MitraTracking.jsx src/gandeng/pages/GandengTracking.jsx
          git mv src/gandeng/pages/PengajuanMitra.jsx src/gandeng/pages/PengajuanGandeng.jsx

          git mv src/si-lapak-priok/pages/SilapakApp.jsx src/si-lapak-priok/pages/SiLapakApp.jsx
          git mv src/si-lapak-priok/pages/SilapakBantuan.jsx src/si-lapak-priok/pages/SiLapakBantuan.jsx
          git mv src/si-lapak-priok/pages/SilapakLogin.jsx src/si-lapak-priok/pages/SiLapakLogin.jsx
          git mv src/si-lapak-priok/pages/SilapakMenu.jsx src/si-lapak-priok/pages/SiLapakMenu.jsx
          git mv src/si-lapak-priok/pages/SilapakShell.jsx src/si-lapak-priok/pages/SiLapakShell.jsx
          git mv src/si-lapak-priok/pages/SilapakSidebar.jsx src/si-lapak-priok/pages/SiLapakSidebar.jsx

          git mv src/sakti/pages/Rab.jsx src/sakti/pages/RAB.jsx
          git mv src/sakti/pages/RkaPage.jsx src/sakti/pages/RKAPage.jsx
          git mv src/sakti/pages/BappPage.jsx src/sakti/pages/BAPPPage.jsx
          git mv src/sakti/pages/KasPackages.jsx src/sakti/pages/PaketKas.jsx
          git mv src/sakti/pages/UserManagement.jsx src/sakti/pages/ManajemenAkses.jsx
          git mv src/sakti/madm/pages/MadmDashboard.jsx src/sakti/madm/pages/MADMDashboard.jsx

          git mv src/assets/mitra-logo.svg src/assets/gandeng-logo.svg
          git mv src/assets/sikas-logo.svg src/assets/sakti-logo.svg
          git mv src/assets/silapak-logo.svg src/assets/si-lapak-priok-logo.svg
          git mv src/lib/silapakData.js src/lib/siLapakPriokData.js

          python3 <<'PY'
          from pathlib import Path
          pairs = [
            ('sikas/','sakti/'),('pengajuan-mitra/','gandeng/'),('silapak-priok/','si-lapak-priok/'),
            ('MitraSidebar','GandengSidebar'),('MitraAccountManagement','GandengAccountManagement'),
            ('MitraApp','GandengApp'),('MitraBantuan','GandengBantuan'),('MitraDashboard','GandengDashboard'),
            ('MitraLogin','GandengLogin'),('MitraTracking','GandengTracking'),
            ('PengajuanMitraPage','PengajuanGandengPage'),('PengajuanMitra','PengajuanGandeng'),
            ('SilapakApp','SiLapakApp'),('SilapakBantuan','SiLapakBantuan'),('SilapakLogin','SiLapakLogin'),
            ('SilapakMenu','SiLapakMenu'),('SilapakShell','SiLapakShell'),('SilapakSidebar','SiLapakSidebar'),
            ('silapakData','siLapakPriokData'),
            ('RabPage','RABPage'),('./sakti/pages/Rab','./sakti/pages/RAB'),('./Rab','./RAB'),
            ('RkaPage','RKAPage'),('./sakti/pages/RkaPage','./sakti/pages/RKAPage'),('./RkaPage','./RKAPage'),
            ('BappPage','BAPPPage'),('./sakti/pages/BappPage','./sakti/pages/BAPPPage'),('./BappPage','./BAPPPage'),
            ('KasPackagesPage','PaketKasPage'),('./sakti/pages/KasPackages','./sakti/pages/PaketKas'),('./KasPackages','./PaketKas'),
            ('UserManagementPage','ManajemenAksesPage'),('./sakti/pages/UserManagement','./sakti/pages/ManajemenAkses'),('./UserManagement','./ManajemenAkses'),
            ('MadmDashboard','MADMDashboard'),('./sakti/madm/pages/MadmDashboard','./sakti/madm/pages/MADMDashboard'),('./MadmDashboard','./MADMDashboard'),
          ]
          for p in Path('src').rglob('*'):
            if p.is_file() and p.suffix in {'.js','.jsx','.css'}:
              try: text=p.read_text('utf-8')
              except UnicodeDecodeError: continue
              new=text
              for a,b in pairs: new=new.replace(a,b)
              if new != text: p.write_text(new,'utf-8')
          PY

          rm -f __noop__
          if ! grep -RIl 'AutoLogo' src --exclude='AutoLogo.jsx' 2>/dev/null | grep -q .; then
            git rm -f src/components/AutoLogo.jsx
          fi

      - name: Update repository-facing metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.name='pln-ip-priok-digital-portal';
          p.description='Portal digital PLN Indonesia Power UBP Priok untuk SAKTI, Si Lapak Priok, dan GANDENG.';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          l.name=p.name; if(l.packages?.['']) l.packages[''].name=p.name;
          fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n');
          NODE
          sed -i 's#<title>.*</title>#<title>Portal Digital PLN Indonesia Power UBP Priok</title>#' index.html
          cat > README.md <<'EOF'
          # Portal Digital PLN Indonesia Power UBP Priok

          Portal web terpadu untuk **SAKTI**, **Si Lapak Priok**, dan **GANDENG** di PLN Indonesia Power UBP Priok.

          ## Sistem

          | Sistem | Pengguna | Fungsi utama |
          |---|---|---|
          | **SAKTI** | Humas, Asman, MADM | Proposal, evaluasi, RAB, TOR, pelaksanaan, pembayaran, dokumen, rekap anggaran, inbox review, dan administrasi. |
          | **Si Lapak Priok** | Petugas/operator | Paket masuk/keluar, pengambilan paket, buku tamu, petugas jaga, riwayat, dan bantuan. |
          | **GANDENG** | Perusahaan/lembaga dan admin GANDENG | Registrasi akun, pengajuan proposal, riwayat, tracking Humas → Asman → MADM, bantuan, dan isolasi data per akun. |

          ## Struktur Source

          ```text
          src/
          ├── portal/             # Portal utama dan login bersama
          ├── sakti/              # SAKTI - Humas, Asman, MADM
          ├── si-lapak-priok/     # Si Lapak Priok
          ├── gandeng/            # GANDENG
          ├── components/         # Komponen bersama
          ├── lib/                # Data, helper, generator dokumen
          └── styles/             # Styling global dan responsif
          ```

          ## Tema
          - **SAKTI:** `#036D9A`
          - **Si Lapak Priok:** `#FDEA6F`
          - **GANDENG:** `#CF0000`

          ## Development
          ```bash
          npm ci
          npm run dev
          ```

          ## Production Build
          ```bash
          npm run build
          ```

          Authentication dan business flow existing dipertahankan. Manajemen akses SAKTI + Si Lapak Priok tetap terpisah dari Manajemen Akun GANDENG. Data GANDENG tetap difilter berdasarkan akun/perusahaan yang login.

          **PLN Indonesia Power UBP Priok**
          EOF
          sed -i 's/^          //' README.md

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify naming
        shell: bash
        run: |
          set -euo pipefail
          test -d src/sakti && test -d src/gandeng && test -d src/si-lapak-priok
          test ! -d src/sikas && test ! -d src/pengajuan-mitra && test ! -d src/silapak-priok
          if find src -type f \( -iname '*sikas*' -o -iname '*mitra*' \) | grep -q .; then
            echo 'Legacy SIKAS/Mitra filenames still found:'
            find src -type f \( -iname '*sikas*' -o -iname '*mitra*' \)
            exit 1
          fi

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/repo-align.yml
          git config user.name 'HumasTGP'
          git config user.email 'humastgp@gmail.com'
          git add -A
          git commit -m '[repo-align] Align repository naming with SAKTI, Si Lapak Priok, and GANDENG'
          git push origin HEAD:align-repo-naming-20260812
